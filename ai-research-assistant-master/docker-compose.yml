version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-research-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      - CHROMA_PERSIST_DIR=/app/chroma_db
      - UPLOAD_DIR=/app/data/uploads
      - AUTH_DB_PATH=/app/data/auth.db
      - DEBUG=false
    volumes:
      # Persist ChromaDB data between restarts
      - chroma_data:/app/chroma_db
      # Persist uploaded files and auth database
      - data_store:/app/data
      # Hot-reload frontend without rebuilding (mount frontend dir)
      - ./frontend:/app/../frontend:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: ai-research-streamlit
    env_file:
      - .env
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000/api
      - HEALTH_URL=http://backend:8000/health
    depends_on:
      - backend
    volumes:
      - ./:/app
    restart: unless-stopped

volumes:
  chroma_data:
  data_store:
